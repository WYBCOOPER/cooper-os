<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COOPER OS · 雪山星空方案 A</title>
<style>
  :root {
    --bg: #0B1220;
    --surface: rgba(27,42,74,0.72);
    --surface-strong: rgba(27,42,74,0.94);
    --border: rgba(232,236,245,0.08);
    --text: #F5F7FA;
    --text-dim: #A8B4C8;
    --text-faint: #6B7A93;
    --accent: #8FB8E8;
    --accent-warm: #D4AF6A;
    --sunset: linear-gradient(135deg, #FF6B00, #FF8C00);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0B1220;
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  /* 真实星空背景（细星点，克制） */
  body::before {
    content:''; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(1px 1px at 8% 12%, rgba(245,247,250,0.7) 50%, transparent),
      radial-gradient(1px 1px at 22% 38%, rgba(245,247,250,0.4) 50%, transparent),
      radial-gradient(1.5px 1.5px at 35% 15%, rgba(245,247,250,0.6) 50%, transparent),
      radial-gradient(1px 1px at 48% 62%, rgba(245,247,250,0.5) 50%, transparent),
      radial-gradient(1px 1px at 61% 28%, rgba(245,247,250,0.35) 50%, transparent),
      radial-gradient(1.5px 1.5px at 74% 52%, rgba(245,247,250,0.55) 50%, transparent),
      radial-gradient(1px 1px at 86% 18%, rgba(245,247,250,0.45) 50%, transparent),
      radial-gradient(1px 1px at 93% 70%, rgba(245,247,250,0.5) 50%, transparent),
      radial-gradient(1px 1px at 15% 82%, rgba(143,184,232,0.4) 50%, transparent),
      radial-gradient(1px 1px at 55% 88%, rgba(245,247,250,0.4) 50%, transparent);
    background-color: #0B1220;
  }
  /* 柔和极光渐变（非常淡） */
  body::after {
    content:''; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 70% 45% at 50% -10%, rgba(143,184,232,0.06), transparent),
      radial-gradient(ellipse 50% 35% at 90% 100%, rgba(212,175,106,0.04), transparent);
  }

  .app { max-width: 1080px; margin: 0 auto; padding: 32px 24px; }

  /* 状态栏 */
  .statusbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px; margin-bottom: 28px;
    background: rgba(11,18,32,0.6);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(20px);
    font-size: 13px;
  }
  .brand { font-weight: 700; letter-spacing: .08em; color: var(--text); }
  .brand b { color: var(--accent-warm); }
  .spacer { flex: 1; }
  .stat { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4fe3c1; box-shadow: 0 0 8px rgba(79,227,193,0.6); }
  .clock { font-family: 'Cascadia Code', Consolas, monospace; color: var(--text); font-size: 13px; letter-spacing: .05em; }

  /* 中央核心（时钟） */
  .hero { display: flex; justify-content: center; margin: 20px 0 48px; }
  .core {
    width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(143,184,232,0.10), rgba(11,18,32,0.9) 70%);
    border: 1px solid rgba(232,236,245,0.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 60px rgba(143,184,232,0.06), inset 0 0 40px rgba(143,184,232,0.04);
    position: relative;
  }
  .core::before {
    content:''; position: absolute; top: 0; left: 18%; right: 18%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,106,0.35), transparent);
  }
  .core-time { font-family: 'Cascadia Code', Consolas, monospace; font-size: 44px; font-weight: 300; color: #F5F7FA; letter-spacing: .03em; }
  .core-date { font-size: 12px; color: var(--text-dim); letter-spacing: .18em; margin-top: 8px; }
  .core-label { font-size: 10px; color: var(--accent-warm); letter-spacing: .3em; margin-top: 14px; opacity: .8; }

  /* 模块区 */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .card {
    background: linear-gradient(160deg, rgba(27,42,74,0.85), rgba(16,24,40,0.92));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    backdrop-filter: blur(16px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 32px rgba(0,0,0,0.3);
    transition: transform .25s var(--ease), border-color .25s;
    position: relative;
    cursor: pointer;
  }
  .card::before {
    content:''; position: absolute; top: 0; left: 14%; right: 14%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,106,0.25), transparent);
    opacity: 0; transition: opacity .3s;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(232,236,245,0.16); }
  .card:hover::before { opacity: 1; }
  .card .ic { font-size: 26px; display: block; margin-bottom: 12px; }
  .card .name { font-size: 15px; font-weight: 600; color: var(--text); }
  .card .sub { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }
  .card .count { font-family: 'Cascadia Code', monospace; font-size: 20px; color: var(--accent); margin-top: 10px; }

  /* 次级区 */
  .wide { grid-column: span 2; }

  /* 按钮 */
  .btn {
    background: linear-gradient(135deg, #FF6B00, #FF8C00);
    color: #0B1220; border: none; border-radius: 10px;
    padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,107,0,0.2);
    transition: transform .2s var(--ease), box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,0,0.3); }
  .btn-ghost {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 20px; font-size: 13px; cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .btn-ghost:hover { border-color: rgba(232,236,245,0.3); background: rgba(232,236,245,0.05); }

  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .core { width: 200px; height: 200px; }
    .core-time { font-size: 34px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="statusbar">
    <div class="brand">COOPER<b>//</b>OS</div>
    <div class="spacer"></div>
    <div class="stat"><span class="dot"></span>系统在线</div>
    <span class="clock" id="clock">--:--</span>
  </div>

  <div class="hero">
    <div class="core">
      <div class="core-time" id="bigclock">--:--:--</div>
      <div class="core-date" id="bigdate">----.--.--</div>
      <div class="core-label">C O O P E R // O S</div>
    </div>
  </div>

  <div class="grid">
    <div class="card"><span class="ic">📚</span><div class="name">学业</div><div class="sub">拆解 · 课程 · 追踪</div><div class="count">0</div></div>
    <div class="card"><span class="ic">💼</span><div class="name">工作</div><div class="sub">项目 · 里程碑</div><div class="count">0</div></div>
    <div class="card"><span class="ic">🏠</span><div class="name">生活</div><div class="sub">习惯 · 健康</div><div class="count">0</div></div>
    <div class="card"><span class="ic">📓</span><div class="name">日记</div><div class="sub">记录每一天</div><div class="count">0</div></div>
  </div>

  <div class="grid">
    <div class="card wide">
      <div class="name">今日聚焦</div>
      <div class="sub" style="margin-top:10px">— 山间空旷，记下今天最重要的事 —</div>
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="btn-ghost" style="flex:1">＋ 添加聚焦</button>
      </div>
    </div>
    <div class="card">
      <div class="name">学习追踪</div>
      <div class="sub" style="margin-top:10px">C · Python · LeetCode</div>
      <div style="margin-top:14px"><button class="btn" style="width:100%">开始学习</button></div>
    </div>
  </div>
</div>

<script>
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    const n = new Date();
    document.getElementById('clock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
    document.getElementById('bigclock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
    document.getElementById('bigdate').textContent = n.getFullYear() + '.' + pad(n.getMonth()+1) + '.' + pad(n.getDate());
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
