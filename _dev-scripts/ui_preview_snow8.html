<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COOPER OS · 雪山方案 v8（真实峰顶）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background: #060a16;
    color: #fff;
    display: flex; justify-content: center;
    padding: 16px 20px 40px;
  }

  .frame { width: 100%; max-width: 1240px; }

  .scene {
    position: relative;
    width: 100%;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.55);
  }
  .scene .bg { display: block; width: 100%; height: auto; }

  /* ===== 月亮圆盘：水平精确对齐主峰（50%），放在主峰正上方天空 ===== */
  .moon {
    position: absolute;
    left: 50%; top: 22%;
    transform: translateX(-50%) translateY(-50%);
    width: clamp(150px, 19vw, 250px);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,0.24), rgba(255,255,255,0.05) 40%, transparent 58%),
      radial-gradient(circle at 50% 50%, rgba(26,38,64,0.62), rgba(10,14,26,0.7));
    border: 1px solid rgba(255,255,255,0.36);
    box-shadow:
      inset 6px 6px 22px rgba(255,255,255,0.07),
      inset -8px -8px 26px rgba(0,0,0,0.35),
      0 0 80px rgba(232,201,143,0.16),
      0 16px 50px rgba(0,0,0,0.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    z-index: 3;
  }
  .moon::after {
    content:''; position: absolute; inset: -16px; border-radius: 50%;
    border: 1px solid rgba(232,201,143,0.28);
    box-shadow: 0 0 50px rgba(232,201,143,0.14);
  }
  .moon-time { font-family: 'Cascadia Code', Consolas, monospace; font-size: clamp(26px, 3.4vw, 42px); font-weight: 300; letter-spacing: .02em; text-shadow: 0 2px 14px rgba(0,0,0,0.55); }
  .moon-date { font-size: clamp(9px, 1.1vw, 12px); letter-spacing: .2em; margin-top: 5px; color: rgba(255,255,255,0.9); }
  .moon-label { font-size: clamp(7px, .85vw, 9px); letter-spacing: .3em; margin-top: 8px; color: #e8c98f; }
  .moon .focus {
    margin-top: 10px; padding: 5px 14px;
    background: linear-gradient(135deg, rgba(232,201,143,0.2), rgba(232,201,143,0.08));
    border: 1px solid rgba(232,201,143,0.5);
    border-radius: 100px;
    font-size: clamp(9px, 1.05vw, 12px); color: #f0d9a8;
    max-width: 88%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  /* ===== 峰顶按钮：按原图真实峰顶坐标放置 ===== */
  .peak-btn {
    position: absolute;
    transform: translate(-50%, -50%);
    width: clamp(30px, 3.6vw, 42px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.7), rgba(232,201,143,0.5) 50%, rgba(232,201,143,0.15) 100%);
    border: 1.5px solid rgba(255,255,255,0.6);
    box-shadow:
      0 0 16px rgba(232,201,143,0.45),
      0 3px 10px rgba(0,0,0,0.5),
      inset 0 1px 3px rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform .25s cubic-bezier(0.16,1,0.3,1), box-shadow .25s;
    z-index: 4;
  }
  .peak-btn .ic { font-size: clamp(13px, 1.5vw, 17px); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45)); }
  .peak-btn:hover { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 30px rgba(232,201,143,0.75), 0 6px 16px rgba(0,0,0,0.5); }
  .peak-btn:hover .btn-name { opacity: 1; }

  .btn-name {
    position: absolute; top: 115%; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(10px, 1.1vw, 13px);
    font-weight: 600; letter-spacing: .1em;
    color: #fff;
    text-shadow: 0 1px 8px rgba(0,0,0,0.95), 0 0 16px rgba(0,0,0,0.7);
    white-space: nowrap;
    opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }

  /* ===== 状态栏 ===== */
  .statusbar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 6px; font-size: 13px;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .brand { font-weight: 700; letter-spacing: .12em; }
  .brand b { color: #e8c98f; }
  .spacer { flex: 1; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.85); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #9ee8c8; box-shadow: 0 0 8px rgba(158,232,200,0.9); }
  .clock { font-family: 'Cascadia Code', Consolas, monospace; }

  @media (max-width: 640px) {
    .btn-name { font-size: 9px; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="statusbar">
    <div class="brand">COOPER<b>//</b>OS</div>
    <div class="spacer"></div>
    <div class="stat"><span class="dot"></span>系统在线</div>
    <span class="clock" id="clock">--:--</span>
  </div>

  <div class="scene">
    <img src="snow_bg.png" class="bg" alt="">

    <!-- 月亮：水平 50% 精确对齐主峰，垂直在主峰正上方天空 -->
    <div class="moon">
      <div class="moon-time" id="bigclock">--:--:--</div>
      <div class="moon-date" id="bigdate">----.--.--</div>
      <div class="moon-label">C O O P E R // O S</div>
      <div class="focus">🎯 今日聚焦：写一页 C 语言笔记</div>
    </div>

    <!-- 7 个真实峰顶（按图像分析坐标，从左到右）-->
    <!-- 峰6 最左低峰 10%,90% -->
    <div class="peak-btn" style="left:10%; top:90%">
      <span class="ic">📓</span>
      <span class="btn-name">日记</span>
    </div>
    <!-- 峰4 20%,80% -->
    <div class="peak-btn" style="left:20%; top:80%">
      <span class="ic">📚</span>
      <span class="btn-name">学业</span>
    </div>
    <!-- 峰2 30%,70% -->
    <div class="peak-btn" style="left:30%; top:70%">
      <span class="ic">🛠</span>
      <span class="btn-name">工具</span>
    </div>
    <!-- 峰5 40%,85% -->
    <div class="peak-btn" style="left:40%; top:85%">
      <span class="ic">💬</span>
      <span class="btn-name">对话</span>
    </div>
    <!-- 峰1 主峰 50%,60%（最高最重要→工作）-->
    <div class="peak-btn" style="left:50%; top:60%">
      <span class="ic">💼</span>
      <span class="btn-name">工作</span>
    </div>
    <!-- 峰7 60%,95% -->
    <div class="peak-btn" style="left:60%; top:95%">
      <span class="ic">📖</span>
      <span class="btn-name">知识库</span>
    </div>
    <!-- 峰3 70%,75% -->
    <div class="peak-btn" style="left:70%; top:75%">
      <span class="ic">🏠</span>
      <span class="btn-name">生活</span>
    </div>
  </div>
</div>

<script>
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    const n = new Date();
    document.getElementById('clock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
    document.getElementById('bigclock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
    document.getElementById('bigdate').textContent = n.getFullYear() + '.' + pad(n.getMonth()+1) + '.' + pad(n.getDate());
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
