<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>峰顶位置确认</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060a16; display: flex; justify-content: center; padding: 20px; }
  .wrap { width: 100%; max-width: 1240px; }
  h3 { color: #e8c98f; font-family: 'Segoe UI', sans-serif; margin-bottom: 10px; letter-spacing: .1em; font-size: 15px; }
  .scene { position: relative; width: 100%; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .scene img { display: block; width: 100%; height: auto; }
  /* 十字准星标记 */
  .mark {
    position: absolute; transform: translate(-50%, -50%);
    width: 44px; height: 44px;
  }
  .mark::before, .mark::after {
    content:''; position: absolute; background: rgba(255,80,80,0.95);
  }
  .mark::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  .mark::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  .num {
    position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    background: rgba(255,80,80,0.95); color: #fff;
    font: 700 13px/22px 'Segoe UI', sans-serif;
    border-radius: 50%; width: 22px; height: 22px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div class="wrap">
  <h3>红色十字 = 老师以为的峰顶位置（编号 1-7）</h3>
  <div class="scene">
    <img src="snow_bg.png" alt="">
    <div class="mark" style="left:10%; top:90%"><span class="num">1</span></div>
    <div class="mark" style="left:20%; top:80%"><span class="num">2</span></div>
    <div class="mark" style="left:30%; top:70%"><span class="num">3</span></div>
    <div class="mark" style="left:40%; top:85%"><span class="num">4</span></div>
    <div class="mark" style="left:50%; top:60%"><span class="num">5</span></div>
    <div class="mark" style="left:60%; top:95%"><span class="num">6</span></div>
    <div class="mark" style="left:70%; top:75%"><span class="num">7</span></div>
  </div>
</div>
</body>
</html>
